<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar treino — Academia</title>
</head>
<body>
    <h2>Criar treino</h2>
    <form method="post">
        {% csrf_token %}
        <p><label>Nome: <input type="text" name="nome_treino" required></label></p>
        <p><label>Descricao: <textarea name="descricao" required></textarea></label></p>
        <p><label>ID do aluno: <input type="number" name="aluno_id" required></label></p>
        <p><label>Grupo muscular: <input type="text" name="grupo_muscular" required></label></p>
        <p><label>Exercicios: <input type="text" name="exercicios" placeholder='["Supino", "Remada"]'></label></p>
        <p><label>Series: <input type="number" name="series" required></label></p>
        <p><label>Repeticoes: <input type="number" name="repeticoes" required></label></p>
        <p><label>Data: <input type="date" name="data" required></label></p>
        <button type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'listar_treinos' %}">Voltar</a></p>
</body>
</html>
