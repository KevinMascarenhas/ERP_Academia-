{% extends "base.html" %}

{% block title %}Criar Treino | Fit API{% endblock %}

{% block body %}
<div class="container page-shell">
    <div class="page-header">
        <div>
            <h2>Criar treino</h2>
            <p class="section-subtitle">Cadastre um novo treino para um aluno.</p>
        </div>
        <a href="{% url 'listar_treinos' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <div class="form-card">
        <form method="post"
              data-api-url="/api/treinos/"
              data-method="POST"
              data-success-redirect="{% url 'listar_treinos' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome_treino" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Aluno</label>
                    <select name="aluno_id" class="form-select" required>
                        {% for aluno in alunos %}
                            <option value="{{ aluno.id }}">{{ aluno.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Grupo muscular</label>
                    <input type="text" name="grupo_muscular" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Séries</label>
                    <input type="number" name="series" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Repetições</label>
                    <input type="number" name="repeticoes" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Descrição</label>
                    <textarea name="descricao" class="form-control" required></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Exercicios</label>
                    <input type="text" name="exercicios" class="form-control" placeholder='["Supino", "Remada"]'>
                    <div class="helper-text mt-2">Informe uma lista JSON ou uma lista separada por vírgulas.</div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
