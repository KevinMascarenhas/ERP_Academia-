{% extends "base.html" %}

{% block title %}Criar Pagamento | Fit API{% endblock %}

{% block body %}
<div class="container page-shell">
    <div class="page-header">
        <div>
            <h2>Criar pagamento</h2>
            <p class="section-subtitle">Cadastre um novo pagamento.</p>
        </div>
        <a href="{% url 'listar_pagamentos' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <div class="form-card">
        <form method="post"
              data-api-url="/api/pagamentos/"
              data-method="POST"
              data-success-redirect="{% url 'listar_pagamentos' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Aluno</label>
                    <select name="aluno_id" class="form-select" required>
                        {% for aluno in alunos %}
                            <option value="{{ aluno.id }}">{{ aluno.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Valor</label>
                    <input type="number" step="0.01" name="valor" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Mes/Ano</label>
                    <input type="text" name="mes_ano" class="form-control" placeholder="MM/AAAA" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="pendente">Pendente</option>
                        <option value="pago">Pago</option>
                        <option value="atrasado">Atrasado</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
