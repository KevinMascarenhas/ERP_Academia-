<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar plano — Academia</title>
</head>
<body>
    <h2>Criar plano</h2>
    <form method="post">
        {% csrf_token %}
        <p><label>Nome: <input type="text" name="nome_plano" required></label></p>
        <p><label>Preco: <input type="number" step="0.01" name="preco" required></label></p>
        <p><label>Modalidades inclusas: <input type="number" name="modalidades_inclusas" required></label></p>
        <p><label>Duracao em meses: <input type="number" name="duracao_meses" required></label></p>
        <button type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'listar_planos' %}">Voltar</a></p>
</body>
</html>
