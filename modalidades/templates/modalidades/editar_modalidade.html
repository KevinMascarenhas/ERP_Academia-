{% extends "base.html" %}

{% block title %}Editar Modalidade | Fit API{% endblock %}

{% block body %}
<div class="container page-shell">
    <div class="page-header">
        <div>
            <h2>Editar modalidade</h2>
            <p class="section-subtitle">Atualize os dados da modalidade selecionada.</p>
        </div>
        <a href="{% url 'listar_modalidades' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <div class="form-card">
        <form method="post"
              data-api-url="/api/modalidades/{{ modalidade.id }}/"
              data-method="PUT"
              data-success-redirect="{% url 'listar_modalidades' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" name="modalidade_nome" class="form-control" value="{{ modalidade.modalidade_nome }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Categoria</label>
                    <input type="text" name="categoria" class="form-control" value="{{ modalidade.categoria }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Horário</label>
                    <input type="text" name="horario" class="form-control" value="{{ modalidade.horario }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Dias da semana</label>
                    <input type="text" name="dias_semana" class="form-control" value="{{ modalidade.dias_input }}">
                    <div class="helper-text mt-2">Informe os dias separados por vírgula, por exemplo: Segunda, Quarta.</div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Salvar alterações</button>
        </form>
    </div>
</div>
{% endblock %}
