{% extends "base.html" %}

{% block title %}Criar Frequencia | Fit API{% endblock %}

{% block body %}
<div class="container page-shell">
    <div class="page-header">
        <div>
            <h2>Nova frequencia</h2>
            <p class="section-subtitle">Registre a presença do aluno na modalidade.</p>
        </div>
        <a href="{% url 'listar_frequencias' %}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <div class="form-card">
        <form method="post"
              data-api-url="/api/modalidades/frequencias/"
              data-method="POST"
              data-success-redirect="{% url 'listar_frequencias' %}">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Aluno</label>
                    <select name="aluno_id" class="form-select" required>
                        {% for aluno in alunos %}
                            <option value="{{ aluno.id }}">{{ aluno.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Modalidade</label>
                    <select name="modalidade_id" class="form-select" required>
                        {% for modalidade in modalidades %}
                            <option value="{{ modalidade.id }}">{{ modalidade.modalidade_nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Hora</label>
                    <input type="time" name="hora" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}
